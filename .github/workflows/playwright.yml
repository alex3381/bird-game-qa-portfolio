name: Bird Game Playwright Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: 10_AUTOMATION/Playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 10_AUTOMATION/Playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Chromium regression
        run: npm run test:chromium

      - name: Run Firefox compatibility smoke
        run: npx playwright test e2e/BR-NFR-001_browser-compatibility.spec.js --project=firefox

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 10_AUTOMATION/Playwright/playwright-report/
          retention-days: 30
